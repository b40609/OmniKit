name: 部署看板

# 2026-11-24 定案：集中火力維護本機＋Tailscale 手機 PWA 個人面板（scripts/cockpit.py），
# 凍結公開 GitHub Pages 自動部署，改為僅手動觸發（workflow_dispatch）；build.py 仍保留給 marketplace 使用。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run engine/scripts/build.py --site _site
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
