name: 檢查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 名冊
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run engine/scripts/validate.py
      # 入口接線、刪舊孤兒與反假綠燈稽核（防假完工閘門 G2+G3）與單一事實來源／本機狀態板自我測試
      - run: uv run engine/scripts/wiring_audit.py --selftest
      - run: uv run engine/scripts/wiring_audit.py
      - run: uv run engine/scripts/kit.py --selftest
      - run: uv run engine/scripts/status.py --selftest
      - run: uv run scripts/cockpit.py --selftest
      - run: uv run engine/scripts/cleanroom_e2e.py --selftest
      # marketplace 清單是由名冊產生的，commit 進來的版本要跟名冊一致
      - run: uv run engine/scripts/build.py --check
      # 看板要能正常產生
      - run: uv run engine/scripts/build.py --site _site
      # 評估 skill 的離線自我測試
      - run: uv run engine/skills/omnikit-eval/scripts/selftest.py
      # 評估漏斗的批次工具：第 0 層、第 1 層、證據卡、煙霧測試（都不連網、不呼叫模型）
      - run: uv run engine/skills/omnikit-eval/scripts/batch0.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/layer1.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/evidence.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/smoke.py --selftest
      # 第 2 層實測：執行在中性目錄、評審材料去掉組別、雜訊基準（現任自己比自己）、兩種順序一致才算勝、照規則判定（假的執行者與評審）
      - run: uv run engine/skills/omnikit-eval/scripts/layer2.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/blind.py --selftest
      # OmniKeep 手機端工具評估閉環對接 CLI（單筆唯讀評估與拍板回寫，離線自我測試）
      - run: uv run scripts/eval_single.py --selftest
      - run: uv run scripts/record_decision.py --selftest
      # commit 進來的證據卡：格式、引用長度、到期日
      # 安裝前檢查的判斷規則（假的偵測結果）與 doctor
      - run: pwsh -NoProfile -File engine/scripts/preflight.ps1 -SelfTest
      - run: uv run engine/scripts/doctor.py --selftest
      # 開新對話提醒的自我測試
      - run: uv run engine/scripts/session_nudge.py --selftest
      - run: uv run engine/scripts/tips.py --selftest
      - run: uv run engine/scripts/codex_hooks.py --selftest
      # 防毒短暫鎖住檔案時等一下再試（FR-34）：寫檔、複製、刪除的腳本都用它
      - run: uv run engine/scripts/fsretry.py --selftest
      # 維護者版與同事版（含 git hook 只在維護者版同步）、免問核准的個人同意
      - run: uv run engine/scripts/edition.py --selftest
      - run: uv run engine/scripts/claude_allow.py --selftest
      # 確定性護欄 hook：擋 --no-verify、機密檔不進對話、門禁設定不准偷關、改 .py 後 ruff 回饋（只回報新增問題）、Stop 不無限迴圈
      - run: uv run engine/scripts/harness_hooks.py --selftest
      # 規則分層（安全底線 + 分派共用層 + profile）的自我測試
      - run: uv run engine/scripts/profiles.py --selftest
      # 子任務分派：兩層政策的檢查、委派紀錄、Sonnet 試行的判定、本週 Claude 用量的快照
      - run: uv run engine/scripts/dispatch.py --selftest
      - run: uv run engine/scripts/dispatch.py check
      - run: uv run engine/skills/omnikit-dispatch/scripts/run.py show > /dev/null
      # 帳號池第一、二、三階段：名冊與規約表、模型淘汰過濾、探測計畫、狀態機與接手順序、煙霧題組／試用／每週差異、多使用者建議器
      - run: uv run engine/scripts/accounts.py --selftest
      - run: uv run engine/scripts/accounts.py check
      - run: uv run engine/scripts/accounts.py scan > /dev/null
      - run: uv run engine/scripts/account_pool.py --selftest
      - run: uv run engine/scripts/account_pool.py status > /dev/null
      - run: uv run engine/scripts/account_pool.py failover > /dev/null
      - run: uv run engine/scripts/model_eval.py --selftest
      - run: uv run engine/scripts/model_eval.py suite > /dev/null
      - run: uv run engine/scripts/model_eval.py diff > /dev/null
      - run: uv run engine/scripts/pool_setup.py --selftest
      - run: uv run engine/scripts/pool_setup.py recommend > /dev/null
      # 飽和式調研：帳本、停止條件、各管道的解析（假的 gh 與網路）
      - run: uv run engine/skills/omnikit-research/scripts/sweep.py --selftest
      # 說做不到之前的能力清點：各種 shell 的找法（Bash 不補 .cmd）、各 agent 的 MCP 設定不印金鑰、本機端點的判斷
      - run: uv run engine/scripts/capabilities.py --selftest
      - run: uv run engine/skills/omnikit-capabilities/scripts/run.py --json > /dev/null
      # 說做不到查證的 Stop hook：寫死的例子與盲測集的誤擋率、hook 的輸入輸出（擋一次、第二次放行、可關閉）
      - run: uv run engine/scripts/claim_check.py --selftest
      # 完工宣稱 Stop 閘：沒附回執、沒寫沒驗的範圍、證據檔不存在或太舊、git 未提交／未 push、只有靜態要降級；預設只記錄
      - run: uv run engine/scripts/done_check.py --selftest
      # NOW.md 完工路徑確定性門檻：打勾前查 CI（紅燈／進行中／無紀錄一律拒絕打勾）
      - run: uv run engine/scripts/now_tick.py --selftest
      # 副作用量測（D10 改動 3）：指令前後各做一次 SHA-256 快照，允許清單外有變動就 exit 非 0，被包住的指令失敗照傳出結束碼
      - run: uv run engine/scripts/fs_guard.py --selftest
      # 由讀取方判定的心跳（D10 改動 2）：FRESH／STALE／DOWN、讀不到或時鐘錯亂一律 DOWN、全部 FRESH 才 exit 0、pid 與啟動時間向系統查證
      - run: uv run engine/scripts/stale_check.py --selftest
      # 無帳本同步器（規則、skills junction、Claude 薄 plugin、Codex MCP CLI、Antigravity 薄 plugin、零遞迴刪除）自我測試
      - run: uv run engine/scripts/sync.py --selftest
      # 找出每個 agent 在用的設定目錄（多帳號、T3 Code 的實例、CLAUDE_CONFIG_DIR…），以及開新對話時接上新出現的
      - run: uv run engine/scripts/homes.py --selftest
      # 公開 repo 的個人與私有字串規則（合併 gitleaks 設定、不印私有字串）
      - run: uv run engine/scripts/privacy_rules.py --selftest
      - run: uv run engine/scripts/home_watch.py --selftest
      # 狀態資料夾放 ~/.omnikit，舊位置（%LOCALAPPDATA%\omnikit 與封裝的 app 轉存的副本）合併成一份
      - run: uv run engine/scripts/statedir.py --selftest
      # T3 Code 的 Antigravity 轉接程式：帶入規則、照 T3 的規則改 initialize，以及接上、改回 T3 的設定
      - run: uv run engine/scripts/acp_shim.py --selftest
      - run: uv run engine/scripts/t3_acp.py --selftest
      # 訪談建立 profile：掃描、依答案產生 profile，以及 skill 入口能找到 repo
      - run: uv run engine/scripts/scan.py --selftest
      - run: uv run engine/scripts/profile_new.py --selftest
      - run: uv run engine/scripts/module_new.py --selftest
      - run: uv run engine/skills/omnikit-setup/scripts/setup.py scan > /dev/null
      # 候選池與證據等級輔助檢查
      - run: uv run engine/scripts/pool.py --selftest
      - run: uv run engine/scripts/proof.py --selftest
      # 單元測試（治理護欄、無帳本同步、個人面板等 pytest 測試集；不寫 .pytest_cache 以免污染 git status）
      - run: uv run --with pytest --with pyyaml --with jsonschema python -m pytest tests -q -p no:cacheprovider

  # FR-34：同事用的是 Windows，上面「名冊」的每一個 uv run 都在 Windows 再跑一次（windows-ci.ps1 從這個檔案讀，
  # 加了新的檢查不用改兩個地方），另外跑 preflight.ps1 與 install.ps1 的 -SelfTest、install.ps1 -WhatIf，
  # 以及訪談跑完 git status 看不到個人檔案（FR-38）。repo 與暫存資料夾放在長路徑、含空白與中文的資料夾，
  # 並模擬中文 Windows 的 cp950。PowerShell 5.1（powershell）與 7（pwsh）各跑一次
  windows:
    name: Windows（PowerShell ${{ matrix.label }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '5.1'
            exe: powershell
          - label: '7'
            exe: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - name: 自我測試與安裝預覽（長路徑、含空白與中文的路徑、模擬 cp950）
        shell: cmd
        run: ${{ matrix.exe }} -NoProfile -ExecutionPolicy Bypass -File engine\scripts\windows-ci.ps1

  secrets:
    name: 金鑰外洩
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # 固定版本，並比對官方公布的 SHA256；放在 RUNNER_TEMP，不放進要掃的工作目錄
      - run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose .'
      # 個人與私有字串（2026-11-27）：只掃目前版本，不掃歷史。公開規則在 .github/gitleaks-tree.toml（tailnet 主機名、
      # 個人 profile、評測 patch）；私有清單在 repo secret OMNIKIT_PRIVATE_DENYLIST（fork 與外部 PR 沒有，只跑公開規則）。
      # --redact：這個 repo 的 Actions 紀錄是公開的，命中的字串不印出來
      - name: 個人與私有字串
        env:
          OMNIKIT_PRIVATE_DENYLIST: ${{ secrets.OMNIKIT_PRIVATE_DENYLIST }}
        run: |
          python3 engine/scripts/privacy_rules.py config --out "$RUNNER_TEMP/privacy.toml"
          "$RUNNER_TEMP/gitleaks" dir --config "$RUNNER_TEMP/privacy.toml" --redact --verbose --no-banner .
