name: 檢查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: 名冊
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run engine/scripts/validate.py
      # marketplace 清單是由名冊產生的，commit 進來的版本要跟名冊一致
      - run: uv run engine/scripts/build.py --check
      # 看板要能正常產生
      - run: uv run engine/scripts/build.py --site _site
      # 評估 skill 的離線自我測試
      - run: uv run engine/skills/omnikit-eval/scripts/selftest.py
      # 評估漏斗的批次工具：第 0 層、第 1 層、證據卡、煙霧測試、第 2 層排程（都不連網、不呼叫模型）
      - run: uv run engine/skills/omnikit-eval/scripts/batch0.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/layer1.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/evidence.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/smoke.py --selftest
      - run: uv run engine/skills/omnikit-eval/scripts/schedule.py --selftest
      # commit 進來的證據卡：格式、引用長度、到期日
      - run: uv run engine/skills/omnikit-eval/scripts/evidence.py check
      # 安裝前檢查的判斷規則（假的偵測結果）與 doctor
      - run: pwsh -NoProfile -File engine/scripts/preflight.ps1 -SelfTest
      - run: uv run engine/scripts/doctor.py --selftest
      # 開新對話提醒的自我測試
      - run: uv run engine/scripts/session_nudge.py --selftest
      - run: uv run engine/scripts/codex_hooks.py --selftest
      # 維護者版與同事版（含 git hook 只在維護者版同步）、免問核准的個人同意
      - run: uv run engine/scripts/edition.py --selftest
      - run: uv run engine/scripts/claude_allow.py --selftest
      # 規則分層（安全底線 + profile）的自我測試
      - run: uv run engine/scripts/profiles.py --selftest
      # 接上三個 agent（規則、skills、MCP，以及從舊版 skillshare 接手）的自我測試
      - run: uv run engine/scripts/agents.py --selftest
      # 每週彙整用的使用統計：只算實際讀取或呼叫，不算對話開頭的 skill 清單
      - run: uv run engine/scripts/usage.py --selftest
      # 訪談建立 profile：掃描、依答案產生 profile，以及 skill 入口能找到 repo
      - run: uv run engine/scripts/scan.py --selftest
      - run: uv run engine/scripts/profile_new.py --selftest
      - run: uv run engine/skills/omnikit-setup/scripts/setup.py scan > /dev/null

  secrets:
    name: 金鑰外洩
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # 固定版本，並比對官方公布的 SHA256
      - run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks git --redact --verbose .
