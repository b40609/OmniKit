name: 驗證名冊

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run engine/scripts/validate.py
      # marketplace 清單是由名冊產生的，commit 進來的版本要跟名冊一致
      - run: uv run engine/scripts/build.py --check
      # 看板要能正常產生
      - run: uv run engine/scripts/build.py --site _site
