# 領域層：使用者自己選。寫程式、改程式、看懂別人的程式。
id: software-dev
kind: domain
name: 軟體開發
summary: 寫程式、改程式、看懂別人的程式，從規劃到前端畫面。
requires: [browser]
signals:
  files: ["package.json", "pyproject.toml", "requirements.txt", "*.csproj", "go.mod", "Cargo.toml"]
  keywords: [寫程式, 前端, 後端, 重構, debug, API]
maps_to: [development, testing, deployment, Developer Tools, engineering]
slots:
  # 2026-11-14 拆成兩個槽位：工具與應用介面、網頁。三輪實測（data/evals/2026-11-1[34]-frontend-design-F1*.md）
  # 看到 taste-skill 擅長做成有質感的形象頁，用在功能導向的介面上反而犧牲效率；一個槽位只能有一個預設，所以依用途分開
  - id: frontend-design
    name: 前端設計：工具與應用介面
    focus: active
    scenarios:
      - id: F1
        text: 改 <你的前端專案> 的畫面；給一張喜歡的風格參考，要依專案需求重新設計，不能照抄。
      - id: F2
        text: <你的專案> 的後端功能已經完成，決定前端怎麼呈現，讓人看了想用。
      - id: F3
        text: 偶爾需要照原版重建一個現成的網站或畫面，版面、樣式與行為要盡量接近原版。
    search: [frontend design skill, ui design agent, design system]

  - id: web-pages
    name: 前端設計：網頁與形象頁
    focus: active
    scenarios:
      - id: WP1
        text: 做公司官網、產品介紹頁或活動頁，第一眼要有質感，像業界的高品質網頁，不是一般 AI 產生的樣子。
    search: [landing page design skill, website design agent, marketing site]

  - id: code-understanding
    name: 程式碼理解與搜尋
    focus: active
    scenarios:
      - id: C1
        text: 在 <你的專案> 找某個函式的所有呼叫者，以及改動的影響範圍。
      - id: C2
        text: 深讀第三方 repo，寫附行號的研究筆記。
    search: [code search mcp, lsp plugin, code graph, codebase index]
    answers:
      claude:
        verdict: native
        reason: '第 2 層實測（2026-11-16，Sonnet 5.5 medium 各 3 次）：內建的 Grep、Read 在 C1（OmniKeep 找呼叫者與影響範圍）每次都找齊；C2（深讀 pal-mcp-server 寫附行號筆記）graphify、Floorplan 明講要用也沒有贏過雜訊。兩個工具裝著時 12 次都沒被叫用。只測了這兩個情境與中型 repo，LSP、CodeGraph、Serena 還沒測。'
        evidence: data/evals/2026-11-16-code-understanding-C1C2.md
        decided_at: '2026-11-16'
      codex:
        verdict: unknown
        reason: '內建的 grep、glob 搜尋。'

  - id: dev-workflow
    name: 規劃與開發流程
    focus: active
    scenarios:
      - id: V1
        text: 小改動走輕流程（討論計畫、實作、審查），大功能走重流程（規格、獨立審查、實作、驗收）；常跑偏、重工。
    search: [spec driven development, agent workflow, planning skill]
    answers:
      claude:
        verdict: unknown
        reason: 'plan mode、/goal 等，不另外裝方法論。'
      codex:
        verdict: unknown
        reason: 'plan mode、/goal 等，不另外裝方法論。'

  - id: reverse-engineering
    name: 逆向工程
    focus: watch
    scenarios:
      - id: X1
        text: 逆向 APK、.NET、Electron 等目標。
    search: [reverse engineering mcp, decompiler, binary analysis]

  # 2026-11-24 新增三個「確定性品質門禁（Sensors／Harness）」槽位：OmniKeep 三路飽和式調研
  # （前端／Mobile WebKit／桌面 WebApp 191 項、Python／後端 84 項、Agent Harness／Git Hooks／資安 57 項，gh api 實測）
  # 看到名冊偏重提示詞與 skill（機率性引導），缺會擋下錯誤的確定性工具；純靠 AI 寫程式在 iOS WebKit、型別、依賴與邊界上反覆踩雷
  - id: static-guardrails
    name: 確定性程式碼門禁：lint、格式、型別與依賴
    focus: active
    scenarios:
      - id: SG1
        text: <你的專案> 的 Python 後端（例如 FastAPI）每次 agent 改完，用 linter、型別檢查、依賴與分層合約當場擋下錯誤，不靠提示詞叮嚀。
      - id: SG2
        text: <你的前端專案>（Vue 3 或 React、TS、Tailwind v4）每次改完自動格式化並檢查 script、template 與 CSS，死碼與漏列依賴也要抓到。
    search: [python linter, type checker, eslint vue, css linter, dead code detection, dependency check]

  - id: mobile-web-verify
    name: 行動端 WebKit 與桌面 WebApp 實機巡檢
    focus: active
    scenarios:
      - id: MW1
        text: 改完 <你的前端專案> 的手機版，在 Windows 上用真的 WebKit（iPhone 機型）巡檢：橫向溢位、捲動鎖死、輸入框字級、觸控目標大小與無障礙。
      - id: MW2
        text: 除錯包成桌面 App 的 WebApp（Edge WebView2、Tauri），或原生殼階段的行動 App 流程。
    search: [playwright webkit mobile, ios safari testing, accessibility testing, webview2 debugging, mobile e2e]

  - id: git-security-gate
    name: Git hook 與資安門禁
    focus: active
    scenarios:
      - id: GS1
        text: commit 前自動跑格式、lint 與金鑰外洩檢查，agent 不能用 --no-verify 繞過；Windows 原生能跑。
      - id: GS2
        text: 定期依 lockfile 掃描 <你的專案> 的第三方依賴漏洞，並用結構化規則抓出禁用寫法。
    search: [pre-commit hook runner, secret scanning, dependency vulnerability scanner, ast grep lint]
