# 基礎層，但只有維護名冊的人才啟用：找新工具、做與驗證 skill。
id: toolkit
kind: foundation
name: 工具維護
summary: 找新工具，以及製作並驗證自己的 skill。
maintainer_only: true
slots:
  - id: tool-discovery
    name: 工具發現
    focus: active
    scenarios:
      - id: N1
        text: 掌握新的 agent 工具從哪裡出現，送進 OmniKit 的收件匣。
    search: [skill directory, plugin marketplace, mcp registry]

  - id: skill-authoring
    name: skill 製作與評估
    focus: watch
    scenarios:
      - id: K1
        text: 寫一個自己用的 skill，並證明它比沒裝的時候好。
    search: [skill creator, plugin eval, skill authoring]
