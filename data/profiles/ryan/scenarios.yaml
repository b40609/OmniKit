# ryan 的真實情境：評估工具時拿來當考題。
# 列出的槽位整組取代 data/slots.yaml 的範本情境；沒列的槽位沿用範本。
# id 跟範本一致，data/evals 的實測紀錄才對得上。
scenarios:
  frontend-design:
    - id: F1
      text: 在 Windows 用 Claude Code 或 Codex 改 CatOS 的 React／Vite 前端；給一張喜歡的風格參考，要依 CatOS 的需求重新設計，不能照抄。
    - id: F2
      text: OmniKeep 或 CatOS 的後端功能已經完成，決定前端怎麼呈現，讓人看了想用。
    - id: F3
      text: 偶爾需要照原版重建一個現成的網站或畫面，版面、樣式與行為要盡量接近原版。

  review:
    - id: R1
      text: Claude Code 改完 OmniKeep 的 Python 後端修正，交給 Codex 審 diff，或反過來；重要的才交叉審，小改動自己審。

  memory:
    - id: M1
      text: Claude Code 做到一半的 OmniKeep 任務，換到 Codex 或新 session 接手，不用重講脈絡。
    - id: M2
      text: 長 session 經過 compaction 之後，agent 仍然記得做到哪裡、做過哪些決定。

  code-understanding:
    - id: C1
      text: 在 OmniKeep、CatOS 找某個函式的所有呼叫者，以及改動的影響範圍。
    - id: C2
      text: 深讀第三方 repo，寫附行號的研究筆記。

  output-compression:
    - id: T1
      text: 在 OmniKeep 跑 pytest、在 CatOS 跑前端 build，輸出很長，把 context 塞滿。

  tool-discovery:
    - id: N1
      text: 掌握新的 agent 工具從哪裡出現，送進 OmniKit 的收件匣。

  behavior-rules:
    - id: B1
      text: 改功能時只寫需要的程式碼、不擴大範圍，但驗證、錯誤處理與安全照做。

  browser:
    - id: U1
      text: 改完 CatOS 或 OmniKeep 的前端後，agent 自己開 dev server，在瀏覽器看畫面與 console 錯誤，確認改動真的生效才回報；Claude Code 與 Codex 都要能用。

  permissions:
    - id: W1
      text: 跑長任務或測試時不用一直盯；權限提示少，做完會通知。

  concise-output:
    - id: O1
      text: 日常對話先講結果、少廢話，但保留證據（file:line、測試輸出），並維持繁體中文。

  docs-output:
    - id: D1
      text: 產出工作報告與簡報。

  reverse-engineering:
    - id: X1
      text: 逆向 APK、.NET、Electron 等目標。

  skill-authoring:
    - id: K1
      text: 寫 OmniKit 的評估 skill，並證明它比沒裝的時候好。

  product-research:
    - id: P1
      text: 在 OmniKeep 或 CatOS 提優化需求時，先比對業界與開源做法，再提方案。
    - id: P2
      text: 有產品想法時，先找出符合的現有專案，避免重造輪子。

  dev-workflow:
    - id: V1
      text: 小改動走中流程（討論計畫、核准、實作、審查），大功能走重流程（assessment、spec、獨立審查、授權、實作、驗收、closeout）；常跑偏、重工。

  session-management:
    - id: S1
      text: 在 T3 Code 或 Claude 桌面版開 Claude、Codex、Antigravity 的對話時，baseline、ryan 的 AGENTS.md、skills、hooks 照常載入；換介面不用重設。
    - id: S2
      text: 同時跑 CatOS、OmniKeep、OmniKit、ITRI 的 5 個以上任務（含驗收與切片的子對話），不用逐一問，就看得出哪個在等我決定、哪個做完待收尾、哪個卡住。
    - id: S3
      text: 任務做完收尾時，先確認 worktree 乾淨、分支已合併、沒有子對話還在跑，才封存；不誤刪未 commit 的修改，也不會因為封存父對話，連帶收掉還要用的子對話。
    - id: S4
      text: 上下文到一半左右、或 OmniKit 的提醒出現時，一步完成交接：固定格式（目標、已完成、已決定的事、檔案與分支、下三步、風險、驗證方式），開新對話就能接著做；交接內容的品質另由 M1 評。
    - id: S5
      text: 離開座位時，在手機上看各任務進度、回覆問題、核准權限提示，Claude、Codex 都要能用。
