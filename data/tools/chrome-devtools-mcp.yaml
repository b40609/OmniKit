notes: Google Chrome 團隊官方，v1.12.0（2026-10-22），54.7k 星，Apache-2.0。除錯最深：效能追蹤、附 source map 的 console 錯誤、網路請求、截圖；另有 CLI 與 --slim 精簡模式。預設會送使用統計，效能工具會查 Google CrUX，可用 --no-usage-statistics、--no-performance-crux 關掉。第 0 層：npm 由 Google 發布並附 SLSA provenance，7 個 skills 掃描皆 SAFE。U1 實測（2026-11-04）：Claude 端用 CLI 拿 4 分；Codex 非互動要先設 default_tools_approval_mode = "approve"，之後 4 分，沙箱可保留，輸入 16.4 萬 token。以 MCP 形式接 Claude Code 還沒測。細節見 data/evals/2026-11-04-browser-u1.md。
