notes: 微軟官方給 coding agent 用的 CLI 加 skills，v0.1.23（2026-10-31），14.9k 星，Apache-2.0。官方說比 Playwright MCP 省 token，不把整頁資料硬塞進 context。能看 console 與網路請求、錄 trace 與影片、產生 Playwright 測試碼。第 0 層：npm 由微軟發布並附 SLSA provenance，skill 掃描 SAFE。U1 實測（2026-11-04）：Claude 端 4 分（10 秒、輸出約 2,900 字元）；Codex 在 Windows 沙箱裡找不到指令，要關掉整個 shell 沙箱才拿 4 分，輸入 13.6 萬 token，比 DevTools MCP 少 17%。細節見 data/evals/2026-11-04-browser-u1.md。2026-11-04 使用者選 DevTools MCP 進試用，這張當備案，試用不順再拿出來比。2026-11-24 OmniKeep 調研補充（★15,410，Apache-2.0）：Windows 上唯一能在本機跑 `--browser=webkit --device="iPhone 15"` 的省 token agent CLI，是 mobile-web-verify 槽位的首選候選（iOS WebKit 巡檢：橫向溢位 = 0、捲動不鎖死、輸入框 >= 16px）。
added: '2026-11-04'
