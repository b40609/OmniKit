reason: 一手查證（2026-11-28 gh api：★71,156，MIT，最後 push 2026-11-27，Python 3.10+）：版面與表格還原及離線 OCR 能力強，適合高價值 PDF 表格解析；但相依模型權重較重，一般 Office 轉檔仍優先用 MarkItDown，列為按需備案。
sources:
- OmniKeep 2026-11-26 收錄（docling-project/docling）
notes: 與 markitdown 分工：純文字 Office／輕量 PDF 用 markitdown；複雜表格／掃描件／純本機隱私 PDF 用 docling。改判條件：若專案出現每週固定解析法說會／規格書 PDF 表格管線，再升為 trial 測實際表格準確率與 Windows CPU 耗時。
