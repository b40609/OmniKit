trigger_when: 需要將複雜版面、多欄表格或掃描影像 PDF（如財報、法說會簡報、技術規格書）純本機離線（air-gapped）解析成高保真結構化 Markdown／JSON，且輕量工具 MarkItDown 表格失真時按需呼叫。
