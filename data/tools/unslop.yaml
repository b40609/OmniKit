notes: 自我迭代從 omnikeep 的收錄找到（2026-11-13，訊號 omnikeep:3c5fcdbfe765）。支援 Claude Code、Codex、Antigravity。實測：CatOS 依方向打磨時三組最後（2026-11-13-frontend-design-F1.md）；OmniKit 看板使用者排第二、評為最實用（F1b）；LinePort 控制台使用者評細節最完整、配色第一，但那一輪灰階網址給錯，使用者看到的是彩色版（F1c）。Gemini 評審三輪都沒把它排第一，跟使用者不一致。授權 CC-BY-4.0。
