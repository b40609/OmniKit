notes: Claude 桌面版：側邊欄群組、封存（可從 Archived 分頁還原）、「PR 合併或關閉後自動封存」、完成時的系統通知、Remote Control（手機看與回覆）、side chat（/btw）、Context 卡片顯示上下文百分比。Claude 能列出、改名、封存其他桌面版 session，也能開子 session 並交接；看不到 CLI、VS Code、雲端開的 session。CLI：/rename、/clear <名稱>、claude --resume <名稱>，以及 Agent View（claude agents，研究預覽，只列背景 session）。風險：桌面版封存時 worktree 未 commit 的修改可能遺失，worktree 在封存約 30 天後刪除；Agent View 刪除 session 會連 worktree 的未 commit 修改一起刪，claude rm 才會保留。2026-11-09 盤點：桌面版 22 個 session，封存 13 個，封存前用 git 確認 worktree 乾淨、分支已併入；封存父 session 時，已完成的子 session 會被連帶封存（實際發生一次，已還原）。Codex 端的原生功能還沒盤點。
added: '2026-11-09'
