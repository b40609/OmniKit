notes: ★42,205，AGPL-3.0，v1.0.4（2026-11-13），2026-11-18 sweep.py verify 與第 0 層；第 0 層通過，`--scan` 沒找到 skill（MCP server 與執行檔沒有掃，layer0 只掃 skill）。Zig 從頭寫的無頭瀏覽器，給 Puppeteer、Playwright 走 CDP，內建 MCP（stdio 或 HTTP）、`lightpanda agent` 與 Markdown 輸出；skill 另放在 lightpanda-io/agent-skill。預設送使用遙測，要設 LIGHTPANDA_DISABLE_TELEMETRY=true 才關。「比 Chromium 快 9 倍、記憶體少 16 倍」是官方自己的基準，待驗證。它的強項是大量抓頁面轉 Markdown（web-sources 那一類），但同類的 h4ckf0r0day/obscura（★36,291，Apache-2.0）與 lexmount/moli（★23,987，Apache-2.0）README 都寫有 Windows 版與頁面繪製、截圖，要試這類引擎先看那兩個（都還沒實測）。評估紀錄：data/evals/2026-11-18-tool-reeval.md。
added: '2026-11-18'
