reason: 'U1 要在 Windows 上讓 agent 看畫面與 console 錯誤：Lightpanda 沒有 Windows 原生執行檔（只能裝在 WSL 或 Docker），而且沒有繪製引擎，截圖只回佔位內容（README「No graphical rendering engine」、`--dump png` 是 text-only rendering），兩項都過不了。換不掉現在的 Claude 內建瀏覽器與 chrome-devtools-mcp。'
