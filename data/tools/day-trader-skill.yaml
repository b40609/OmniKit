reason: 一手查證（2026-11-28 gh api：★9,941，MIT，v2.0.0，最後 push 2026-10-20）：純 Python 標準庫實作 11 個美股當沖技能（含盤中 5m 分時槽位萬次重播 timemachine.py 與事前風控檢查 check.py），「減倉永遠放行、批次委託依序模擬防組合超限」與「同根雙觸先判停損」具參考價值；但寫死美股 NYSE 時段與 Alpaca 規則、禁加密貨幣且跳空跌破停損仍算 -1R，不直接導入，列觀察參考。
