notes: 一手原始碼反例（2026-11-28 檢視 trader-timemachine/timemachine.py 與 trader-risk/check.py）：(1) 跳空穿價失真：timemachine.py:133 明寫跳空穿過停損仍計為 -1R（A gap through the stop still counts -1R here; a real fill can be worse），且未計滑價與手續費，低估極端尾部風險；(2) 美股硬編碼：綁定 NYSE 09:30–16:00（78 根 5m bar）、Yahoo Finance v8 chart 公開端點（高頻掃描易 429）與 Alpaca 委託規則，check.py:161 明確封鎖加密貨幣，不適用台股（漲跌停／證交稅）與 24/7 加密永續合約 Decimal 核心；(3) 整包掛載 11 個技能會污染日常開發路由。改判條件：未來若開發美股日內當沖模擬模組時，再單獨借鏡其分時段槽位重播與 ASCII 扇形圖呈現。
