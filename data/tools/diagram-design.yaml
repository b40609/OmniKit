notes: 一手原始碼反例（2026-11-28 檢視 skills/diagram-design/SKILL.md 與 .claude-plugin/plugin.json）：(1) SKILL.md 的 description 塞入全部 52 種圖表名稱共 1,110 字元，超過 <= 1,024 字元門檻且常駐成本過高；(2) 第 0 節設有 First-time setup — style guide gate，在品牌樣式尚未定案的專案會阻擋出圖並要求先設定樣式檔；(3) PNG／PDF 匯出腳本需額外瀏覽器渲染依賴。改判條件：待專案品牌視覺與 DESIGN.md 定案後，若高頻產出架構圖／技術報告圖表實測顯著優於裸模型 SVG，再評估裁剪描述轉 trial。
