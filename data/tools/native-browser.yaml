notes: Claude Code 桌面版內建 Browser 面板：自己開 dev server、截圖、看 DOM、點擊與填表，改完檔案預設會自動驗證；用乾淨的設定檔，沒有你的登入。要用已登入的網站時改用 Claude in Chrome（CLI 加 --chrome）。Codex app 內建 browser plugin（in-app browser，給 localhost 用，前端大改後會自己打開）與 chrome plugin（用你的 Chrome 登入狀態，瀏覽資料可能依 OpenAI 帳號的資料設定用於訓練）；這台筆電與另一台桌機的 plugin 快取都有。
