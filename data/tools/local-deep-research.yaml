notes: ★9,597，MIT，v2.0.1 是 2026-11-15（2026-11-17 gh api），第 0 層通過。pip 在 Windows 就裝得起來，預設用 Ollama 本機模型與 SearXNG（要自己架伺服器）；研究時由 langgraph-agent 策略自己挑搜尋引擎（GitHub 引擎預設不開，要 token）。P3 對比實測用本機 qwen3:8b、主搜尋改 Tavily 跑 generate_report 兩次（43.6、29.0 分鐘）：兩次都找到 Archify（第 1 次連結錯），列出 75 與 42 個工具，兩位評審判相關的 10 到 22 與 12 到 17 個，雜訊 71% 與 60%；其中 18 與 19 個是編造的 repo、擴充或網址。omnikit-research 同題至少 162 個相關。8B 本機模型只能當下限，用前沿模型重跑前不判定。紀錄見 data/evals/2026-11-18-product-research-P3.md。
