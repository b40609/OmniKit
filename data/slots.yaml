# 槽位與情境。評估新工具時，用 scenarios 當比較題目。
# focus：active 主動找更好的工具，每週的深度評估額度只用在這些槽位；
#        watch 有新工具進來才做免費初篩；frozen 不評估、不動預設（等 RIA 的結果）。
slots:
  - id: frontend-design
    name: 前端設計
    focus: active
    scenarios:
      - id: F1
        text: 在 Windows 用 Claude Code 或 Codex 改 CatOS 的 React／Vite 前端；給一張喜歡的風格參考，要依 CatOS 的需求重新設計，不能照抄。
      - id: F2
        text: OmniKeep 或 CatOS 的後端功能已經完成，決定前端怎麼呈現，讓人看了想用。

  - id: review
    name: 審查與驗收
    focus: active
    scenarios:
      - id: R1
        text: Claude Code 改完 OmniKeep 的 Python 後端修正，交給 Codex 審 diff，或反過來；重要的才交叉審，小改動自己審。

  - id: memory
    name: 記憶與交接
    focus: active
    scenarios:
      - id: M1
        text: Claude Code 做到一半的 OmniKeep 任務，換到 Codex 或新 session 接手，不用重講脈絡。
      - id: M2
        text: 長 session 經過 compaction 之後，agent 仍然記得做到哪裡、做過哪些決定。

  - id: code-understanding
    name: 程式碼理解與搜尋
    focus: active
    scenarios:
      - id: C1
        text: 在 OmniKeep、CatOS 找某個函式的所有呼叫者，以及改動的影響範圍。
      - id: C2
        text: 深讀第三方 repo，寫附行號的研究筆記。

  - id: output-compression
    name: 指令輸出壓縮
    focus: active
    scenarios:
      - id: T1
        text: 在 OmniKeep 跑 pytest、在 CatOS 跑前端 build，輸出很長，把 context 塞滿。

  - id: tool-discovery
    name: 工具發現
    focus: active
    scenarios:
      - id: N1
        text: 掌握新的 agent 工具從哪裡出現，送進 OmniKit 的收件匣。

  - id: behavior-rules
    name: 行為準則包
    focus: active
    scenarios:
      - id: B1
        text: 改功能時只寫需要的程式碼、不擴大範圍，但驗證、錯誤處理與安全照做。

  - id: browser
    name: 瀏覽器操作與驗證
    focus: active
    scenarios:
      - id: U1
        text: 改完 CatOS 或 OmniKeep 的前端後，agent 自己開 dev server，在瀏覽器看畫面與 console 錯誤，確認改動真的生效才回報；Claude Code 與 Codex 都要能用。

  - id: permissions
    name: 權限與通知
    focus: watch
    scenarios:
      - id: W1
        text: 跑長任務或測試時不用一直盯；權限提示少，做完會通知。

  - id: concise-output
    name: 輸出精簡
    focus: watch
    scenarios:
      - id: O1
        text: 日常對話先講結果、少廢話，但保留證據（file:line、測試輸出），並維持繁體中文。

  - id: docs-output
    name: 文件與簡報產出
    focus: watch
    scenarios:
      - id: D1
        text: 產出工作報告與簡報。

  - id: reverse-engineering
    name: 逆向工程
    focus: watch
    scenarios:
      - id: X1
        text: 逆向 APK、.NET、Electron 等目標。

  - id: skill-authoring
    name: skill 製作與評估
    focus: watch
    scenarios:
      - id: K1
        text: 寫 OmniKit 的評估 skill，並證明它比沒裝的時候好。

  - id: product-research
    name: 產品研究與方向
    focus: frozen
    scenarios:
      - id: P1
        text: 在 OmniKeep 或 CatOS 提優化需求時，先比對業界與開源做法，再提方案。
      - id: P2
        text: 有產品想法時，先找出符合的現有專案，避免重造輪子。

  - id: dev-workflow
    name: 規劃與開發流程
    focus: frozen
    scenarios:
      - id: V1
        text: 小改動走中流程（討論計畫、核准、實作、審查），大功能走重流程（assessment、spec、獨立審查、授權、實作、驗收、closeout）；常跑偏、重工。
