# 常駐規則與自動觸發 Skill 描述預算棘輪（D2 定案，由 validate.py 與 doctor.py 強制守門）
# 原則：超標即阻斷 CI，除非於同一 commit 顯式調高本檔（讓常駐膨脹成為可見 diff）；每次減肥後將上限下調扣緊。

schema_version: 1
updated_at: '2026-11-28'

limits:
  # Antigravity ~/.gemini/AGENTS.md 共用受管區塊上限（2026-11-28 補 D10 完工回執與唯讀 fs_guard 定義後實測 5,955 bytes）
  antigravity_shared_max_bytes: 6050
  # Antigravity ~/.gemini/GEMINI.md 個人受管區塊上限（個人層第二波瘦身：8,605 -> 7,545 -> 7,677 bytes；平台硬上限 24,000 bytes）
  antigravity_personal_max_bytes: 7800
  # Codex ~/.codex/AGENTS.md 合併受管區塊上限（2026-11-28 補 D10 兩項定義後實測 13,578 bytes；平台硬上限 32,768 bytes）
  codex_combined_max_bytes: 13700
  # 所有未設 disable-model-invocation: true 的 engine/skills/*/SKILL.md 之 description 總 UTF-8 bytes（2026-11-28 新增第 8 個核心技能 omnikit-verify 防假完工真機驗收，實測 3,943 bytes）
  auto_skill_desc_max_bytes: 4050
