# 常駐規則「補丁（Patch）」旁註清單（自我迭代出口閥索引）
#
# 規則三分類（見 docs/proposals/2026-11-26-self-iterating-omnikit.md）：
# - 紅線（Safety）：刪檔／外發／付款先問、金鑰保護、禁實盤下單、Computer Use 桌面同意。永不因模型變強而退役，只下沉成 Hook。
# - 契約（Contract）：繁體中文、簡潔回覆、file:line、已回答即定案、禁 LaTeX、git 慣例、狀態標籤、NOW.md、T3 visible 分派與模型角色分工。只在使用者改主意時變動。
# - 補丁（Patch）：補償當代模型或 harness 的能力缺陷。半衰期約 1–3 代模型（或上游修復），只將此類列於本檔追蹤，不在常駐規則內塞額外詮釋文字。

