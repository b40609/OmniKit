# MCP servers：engine/scripts/agents.py 依這份寫進 targets 列的 agent：
#   claude → ~/.claude.json、codex → ~/.codex/config.toml、antigravity → ~/.gemini/config/mcp_config.json
# 只動這裡列的 server 與 OmniKit 管的欄位，使用者改過的先停下來問。維護者版 commit 或 pull 動到這裡時，
# git hook 會自動同步；同事版要重跑 install.ps1。
# options.<agent> 的欄位原樣寫進那個 agent；免問核准（codex 的 default_tools_approval_mode）同事版要本人同意才寫。
# 格式見 engine/schema/mcp.schema.json；金鑰不要寫在這裡。
servers:
  # 瀏覽器槽位，試用到 2026-11-18（見 data/tools/chrome-devtools-mcp.yaml）
  chrome_devtools:
    # 不用 npx：多花約 3 秒啟動，Codex 會在工具註冊好之前就送出第一個請求，模型看不到工具。
    # 改用 install.ps1 依 packages.txt 全域安裝的固定版本；由 cmd 展開 %APPDATA%，換電腦也能用。
    command: cmd
    args:
      - /c
      - node
      - '%APPDATA%/npm/node_modules/chrome-devtools-mcp/build/src/bin/chrome-devtools-mcp.js'
      # 每次用暫時的瀏覽器設定檔，碰不到你的登入狀態；所以 Codex 才設成自動核准
      - --isolated
      - --no-usage-statistics
      - --no-performance-crux
    targets: [claude, codex, antigravity]
    options:
      codex:
        # Codex 非互動模式的核准政策是 never；不設這個，開頁、導向這類工具會全部被拒。
        # 免問核准：維護者版照寫；同事版本人同意了才寫（agents.py approvals）
        default_tools_approval_mode: approve
