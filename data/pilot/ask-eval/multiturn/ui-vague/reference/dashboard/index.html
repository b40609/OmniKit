<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>營運儀表板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="page-title">營運儀表板</h1>
<p class="muted">資料更新時間：2026-11-18 08:00</p>
<div class="cards">
  <div class="card revenue">
    <div class="kpi-label">昨日營收</div>
    <div class="kpi-value">NT$ 1,284,500</div>
    <div class="card-note">比前一天 +4.2%</div>
  </div>
  <div class="card orders">
    <div class="kpi-label">訂單數</div>
    <div class="kpi-value">3,912</div>
    <div class="card-note">比前一天 -1.1%</div>
  </div>
  <div class="card refunds">
    <div class="kpi-label">退貨率</div>
    <div class="kpi-value">2.3%</div>
    <div class="card-note">目標 3% 以下</div>
  </div>
  <div class="card members">
    <div class="kpi-label">新會員</div>
    <div class="kpi-value">418</div>
    <div class="card-note">本週累計 2,031</div>
  </div>
</div>
<p class="footnote">數字為前一日 00:00 到 23:59 的統計，退貨率以件數計。</p>
</body>
</html>
